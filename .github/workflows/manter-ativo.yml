# O Supabase gratuito pausa o banco após 7 dias sem uso.
# Este agendamento faz uma consulta leve a cada 3 dias para mantê-lo ativo.
name: Manter banco ativo

on:
  schedule:
    - cron: '17 11 */3 * *'   # a cada 3 dias, por volta das 8h (horário de Brasília)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar o banco
        run: |
          set -a; . ./.env.production; set +a
          status=$(curl -s -o /dev/null -w '%{http_code}' "$VITE_SUPABASE_URL/rest/v1/unidades?select=id&limit=1" \
            -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY")
          echo "Resposta do Supabase: $status"
          # 401/403 são esperados (visitante sem login); 5xx ou 000 indicam banco fora do ar/pausado
          case "$status" in 5*|000) echo "::error::Banco não respondeu ($status). Verifique o painel do Supabase."; exit 1;; esac
